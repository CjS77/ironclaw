[package]
name = "ironclaw_intake"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Durable intake items: verified inbound messages an intake-mode channel stores instead of starting a turn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (`.claude/rules/cargo-features.md` bar 4, the sanctioned
# `test-support` name): exposes `test_support`, the in-memory per-user
# `/intake` mount the store's consumers share in their tests. Enabled only
# through [dev-dependencies]; never by a shipped artifact.
test-support = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# Self-reference with `test-support` so this crate's own `tests/` binaries
# (which link the lib without `cfg(test)`) can reach `test_support`.
ironclaw_intake = { path = ".", features = ["test-support"] }
libsql = { version = "0.9", default-features = false, features = ["core"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
